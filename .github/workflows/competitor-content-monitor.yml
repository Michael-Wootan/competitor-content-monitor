name: Competitor Content Monitor

on:
  schedule:
    - cron: '0 12 * * 1'  # Monday 12:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print findings, send nothing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run:
    # Scheduled runs are off until the repository variable ENABLE_SCHEDULE is 'true',
    # so a fresh fork or an unconfigured copy never runs (or fails) on its own.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm test

      # config/competitors.json is gitignored; CI writes it from a repository variable
      - name: Write competitor list
        env:
          COMPETITORS_JSON: ${{ vars.COMPETITORS_JSON }}
        run: |
          if [ -n "$COMPETITORS_JSON" ]; then printf '%s' "$COMPETITORS_JSON" > config/competitors.json; fi

      - name: Run competitor content monitor
        run: node src/competitor-content-monitor.js ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_NOTIFY: ${{ vars.EMAIL_NOTIFY }}
          COMPANY_NAME: ${{ vars.COMPANY_NAME }}
